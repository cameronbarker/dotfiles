# Kitty configuration
# Use socket-only remote control to avoid globally exposing remote-control actions.
# This allows local commands via `kitty @ --to ...` without enabling broad remote control.
allow_remote_control socket-only

# Default local Unix socket for Kitty remote control.
# Override per-shell with: export KITTY_LISTEN_ON="unix:/path/to/socket"
listen_on unix:/tmp/kitty

# Note: Kitty remote control affects local Kitty UI state only.
# It is not a tmux replacement and does not provide session persistence.
