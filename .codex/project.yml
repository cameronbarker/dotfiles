version: 1
project:
  name: dotfiles
  type: tooling
  primary_languages: [bash]
codex:
  mode_defaults:
    inspect_first: true
    safe_mode: true
  routing:
    planning_tool: chatgpt_desktop
    execution_tool: codex
ai_context:
  enabled: true
  output_dir: ai-context
  include:
    - AGENTS.md
    - .codex/AGENTS.md
    - README.md
    - install.sh
    - uninstall.sh
    - .terminal
    - terminal/**
  exclude:
    - .git/**
    - tmp/**
risk:
  config_file: .codex/risk-paths.yml
prompts:
  output_dir: .codex/prompts
