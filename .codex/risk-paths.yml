version: 1
defaults:
  level: medium
  action: inspect_only
rules:
  - path: ".codex/**"
    level: high
    action: require_explicit_approval
    reason: "agent and rule configuration"
  - path: "terminal/**"
    level: medium
    action: inspect_first
    reason: "shell startup behavior"
  - path: "install.sh"
    level: high
    action: inspect_first_then_approval
    reason: "system bootstrap changes"
  - path: "uninstall.sh"
    level: high
    action: inspect_first_then_approval
    reason: "destructive potential"
  - path: "**/*secret*"
    level: critical
    action: block_without_confirmation
    reason: "potential sensitive data"
