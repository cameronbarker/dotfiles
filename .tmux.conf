# Keep tmux interaction closer to modern multiplexers (e.g. zellij)
# Click-to-focus panes and mouse resize/selection support.
set -g mouse on
set -g focus-events on

# Ergonomic numbering and automatic window renumbering.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Snappier key handling.
set -sg escape-time 0
set -g repeat-time 300

# Keep substantial scrollback history.
set -g history-limit 100000

# Use vi keys in copy mode/search.
setw -g mode-keys vi

# Beginner-first status hints (recall aid).
set -g status-interval 5
set -g status-left-length 120
set -g status-left '#[fg=colour45,bold]PREFIX C-b #[default]| ? help | S split-h | V split-v | N new | H help | D detach'
set -g status-right '#S'

# Sane split keys keep cwd in the new pane.
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Direct splits (zellij-like) without prefix.
bind -n M-\\ split-window -h -c '#{pane_current_path}'
bind -n M-- split-window -v -c '#{pane_current_path}'

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mnemonic prefix fallbacks for beginners.
bind S split-window -h -c '#{pane_current_path}'
bind V split-window -v -c '#{pane_current_path}'
bind N new-window -c '#{pane_current_path}'
bind Q kill-pane
bind D detach-client
bind H if-shell -F '#{>=:#{version},3.2}' "display-popup -E 'printf \"%s\n\" \"tmux quick help\" \"Prefix: Ctrl+b\" \"S: split horizontal\" \"V: split vertical\" \"N: new window\" \"Q: close pane\" \"D: detach\" \"h/j/k/l: move panes\" \"Alt+h/j/k/l: move (if Meta works)\" \"Alt+\\\\: split horizontal\" \"Alt+-: split vertical\"'" "display-message 'Prefix C-b | S split-h | V split-v | N new | Q close-pane | D detach | h/j/k/l move'"

# Direct pane navigation (zellij-like) without prefix.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Quick custom-key cheat sheet (popup when available, message fallback).
bind ? if-shell -F '#{>=:#{version},3.2}' "display-popup -E 'printf \"%s\n\" \"tmux quick start\" \"Prefix: Ctrl+b\" \"\" \"Daily flow:\" \"1) C-b N -> new window\" \"2) C-b S or C-b V -> split pane\" \"3) C-b h/j/k/l -> move panes\" \"4) C-b D -> detach\" \"5) tmux attach -t <name> -> reattach\" \"\" \"Direct keys (if Alt/Meta works):\" \"Alt+h/j/k/l move panes\" \"Alt+\\\\ split horizontal\" \"Alt+- split vertical\"'" "display-message 'C-b then: N new | S split-h | V split-v | h/j/k/l move | D detach | H/? help'"

# Subtle focused-pane cue.
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour45'

# Truecolor/RGB support (works well with iTerm2 + xterm-256color).
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:RGB'

# Clipboard pass-through via OSC52 when terminal supports it (iTerm2 setting required).
set -s set-clipboard on

# Show one-time reminder when a new session starts.
set-hook -g session-created 'display-message "Welcome to tmux: Prefix is Ctrl+b. Press ? for help."'
