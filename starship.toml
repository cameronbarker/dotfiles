# =============================================================================
# starship.toml — Starship prompt configuration
# https://starship.rs/config/
#
# Installation:
#   1. Install Starship: curl -sS https://starship.rs/install.sh | sh
#   2. Symlink this file:
#        mkdir -p ~/.config && ln -s ~/projects/pb-configs/starship.toml ~/.config/starship.toml
# =============================================================================

# Top-level format: order of segments in the prompt
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Wait N ms for shell commands to complete before showing the prompt
command_timeout = 500

# -----------------------------------------------------------------------------
# Directory
# -----------------------------------------------------------------------------
[directory]
truncation_length = 3          # show last N path components
truncate_to_repo = true        # truncate to git repo root when inside one
style = "bold blue"

# -----------------------------------------------------------------------------
# Git
# -----------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bold purple"
truncation_length = 30

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"
stashed = "$${count}"

# -----------------------------------------------------------------------------
# Command duration
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000               # only show for commands taking > 2s
format = " took [$duration]($style)"
style = "yellow"

# -----------------------------------------------------------------------------
# Prompt character
# -----------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# -----------------------------------------------------------------------------
# Language runtimes (enable as needed)
# -----------------------------------------------------------------------------
[nodejs]
disabled = false
symbol = " "

[ruby]
disabled = false
symbol = " "

[python]
disabled = true

[golang]
disabled = true

[rust]
disabled = true
